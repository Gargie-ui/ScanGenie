name: Supabase Health Check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase Database
        run: |
          curl -f "${{ secrets.SUPABASE_URL }}/rest/v1/documents?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
